paths:
  cam:
    runOnInit: >
      ffmpeg
      -vaapi_device /dev/dri/renderD128
      -f v4l2
      -input_format mjpeg
      -video_size 1920x1080
      -framerate 30
      -i /dev/video0
      -vf format=nv12,hwupload
      -c:v h264_vaapi
      -profile:v high
      -level 4.2
      -rc_mode ICQ
      -qp 28
      -f rtsp
      rtsp://localhost:$RTSP_PORT/$MTX_PATH
    runOnInitRestart: yes
writeQueueSize: 1024
pathDefaults:
  record: yes
  recordDeleteAfter: 0s
  recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S.%f